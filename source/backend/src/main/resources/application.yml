spring:
  data:
    mongodb:
      uri: mongodb://admin:password@localhost:27017/tkartdb?authSource=admin
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8080
jwt:
  secret: your_jwt_secret
  expiration: 86400000
